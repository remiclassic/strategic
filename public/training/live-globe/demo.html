<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cyber training — animated globe demo</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070b}
    iframe{position:absolute;left:50%;top:50%;width:1920px;height:1080px;border:0;transform-origin:center}
  </style>
</head>
<body>
  <iframe id="globe" src="./overwatch.html" title="Animated cyber training globe" allow="fullscreen"></iframe>
  <script>
    const globe = document.getElementById('globe');
    function fit() {
      const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
      globe.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
