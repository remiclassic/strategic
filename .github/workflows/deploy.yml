name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Build with Astro
        run: npm run build
        env:
          # Public build-time values for the auto-reply pages. Set them in Settings > Secrets and variables > Actions > Variables.
          PUBLIC_AUTOREPLY_API: ${{ vars.PUBLIC_AUTOREPLY_API }}
          WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER }}
          META_APP_ID: ${{ vars.META_APP_ID }}
          META_CONFIG_ID: ${{ vars.META_CONFIG_ID }}
      - name: Verify production tracking output
        run: npm run verify:tracking
      - name: Unit tests
        run: npm test
      - name: E2E smoke tests
        run: npm run test:e2e
      - name: Create .nojekyll file
        run: touch ./dist/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Ping IndexNow with sitemap
        if: always()
        continue-on-error: true
        run: |
          key="cf6b27e3a9454af0a9e60e1b8e7f2c13"
          host="strategicsloth.com"
          sitemap="https://strategicsloth.com/sitemap-index.xml"
          curl -s -X POST 'https://api.indexnow.org/indexnow' -H 'Content-Type: application/json' -d "{\"host\":\"$host\",\"key\":\"$key\",\"keyLocation\":\"https://$host/$key.txt\",\"urlList\":[\"$sitemap\"]}" || true
          curl -s "https://api.indexnow.org/indexnow?host=$host&key=$key&keyLocation=https://$host/$key.txt&sitemap=$sitemap" || true